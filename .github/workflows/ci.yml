# CI pipeline for Jane OS
# Security note: this workflow contains NO untrusted input interpolation.
# No `${{ }}` expressions reference github.event.* in run: commands.
# SAFE per OWASP GitHub Actions injection guidance.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run smoke test
        run: bash tests/smoke_test.sh
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run smoke test
        run: bash tests/smoke_test.sh
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run smoke test
        run: bash tests/smoke_test.sh
